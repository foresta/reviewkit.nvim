[package]
name = "reviewkit"
description = "Session, sources and sinks for reviewkit.nvim, as a JSON-speaking CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "reviewkit"
path = "src/lib.rs"

[[bin]]
name = "reviewkit"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
env_logger = "0.11.11"
log = "0.4.34"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
which = "8.0.6"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = { version = "1.49.0", features = ["json", "redactions"] }
tempfile = "3.27.0"
