name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned tool versions
        id: versions
        run: make print-versions >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.versions.outputs.rust }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned tool versions
        id: versions
        run: make print-versions >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.versions.outputs.rust }}
      - uses: Swatinem/rust-cache@v2
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ steps.versions.outputs.nvim }}
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ steps.versions.outputs.stylua }}
          args: --check lua plugin tests scripts
      - name: Install lua-language-server
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$HOME/luals"
          gh release download "${{ steps.versions.outputs.luals }}" --repo LuaLS/lua-language-server --pattern '*-linux-x64.tar.gz' --output "$HOME/luals.tar.gz"
          tar -xzf "$HOME/luals.tar.gz" -C "$HOME/luals"
          echo "$HOME/luals/bin" >> "$GITHUB_PATH"
      - run: cargo build --locked
      - run: make check-lua
      - run: make test-lua
      - run: make test-integration
      - name: Install from a local release
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
          make dist dist-sums TARGET=x86_64-unknown-linux-musl
          REVIEWKIT_RELEASE_URL="file://$PWD/dist" nvim --headless -l scripts/install.lua download | tee install.log
          grep -q '(download)$' install.log
          ./bin/reviewkit version
