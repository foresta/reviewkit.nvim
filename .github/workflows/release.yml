name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "cli/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Makefile"
      - "lua/reviewkit/install.lua"
      - "lua/reviewkit/types.lua"
      - "scripts/install.lua"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned tool versions
        id: versions
        run: make print-versions >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.versions.outputs.rust }}
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: make dist TARGET=${{ matrix.target }}
      - name: Smoke test
        shell: bash
        run: |
          bin="dist/reviewkit-${{ matrix.target }}"
          # The linker signs ad hoc only for arm64, where an unsigned binary is
          # killed at exec; x86_64 binaries run unsigned.
          if [ "${{ matrix.target }}" = aarch64-apple-darwin ]; then codesign -v "$bin"; fi
          if [ "${{ matrix.target }}" = x86_64-apple-darwin ]; then
            softwareupdate --install-rosetta --agree-to-license >/dev/null 2>&1 || true
            out=$(arch -x86_64 "$bin" version)
          else
            out=$("$bin" version)
          fi
          echo "$out"
          want=$(sed -n 's/^M.SCHEMA_VERSION = \([0-9]*\)$/\1/p' lua/reviewkit/types.lua)
          echo "$out" | grep -q "\"schema_version\":$want"
      - uses: actions/upload-artifact@v4
        with:
          name: reviewkit-${{ matrix.target }}
          path: dist/reviewkit-${{ matrix.target }}
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: The tag names the Cargo version
        run: |
          v=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          case "$v" in *-*) echo "refusing to release the pre-release version $v"; exit 1 ;; esac
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match Cargo version $v"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum reviewkit-* > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/reviewkit-*"
      # A draft until every asset is up: a published release without
      # SHA256SUMS makes installers fall back to building from source.
      # A rerun after a failed publish finds the draft already there, so it
      # re-uploads over it instead of creating it again.
      # Only gh's "release not found" means there is none: taking a network
      # or server error for it would create a release that may already exist.
      - run: |
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>"$RUNNER_TEMP/view.err"); then
            :
          elif grep -q '^release not found$' "$RUNNER_TEMP/view.err"; then
            draft=missing
          else
            cat "$RUNNER_TEMP/view.err" >&2
            echo "could not read the release $GITHUB_REF_NAME"
            exit 1
          fi
          if [ "$draft" = false ]; then
            echo "$GITHUB_REF_NAME is already published; leaving its assets alone"
            exit 0
          elif [ "$draft" = true ]; then
            gh release upload "$GITHUB_REF_NAME" --clobber dist/*
          elif [ "$draft" = missing ]; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes dist/*
          else
            echo "unexpected isDraft for $GITHUB_REF_NAME: $draft"
            exit 1
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}

  verify:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned tool versions
        id: versions
        run: make print-versions >> "$GITHUB_OUTPUT"
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ steps.versions.outputs.nvim }}
      - name: Install from the published release
        run: |
          nvim --headless -l scripts/install.lua download | tee install.log
          grep -q '(download)$' install.log
          ./bin/reviewkit version
